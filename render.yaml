# Despliegue en Render con un clic (Blueprint): web + PostgreSQL gratuitos.
# Guía paso a paso: docs/deploy.md
services:
  - type: web
    name: musst
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MUSST_SECURE
        value: "1"
      - key: MUSST_ADMINS  # usuarios administradores, separados por comas
        value: "sara"
      - key: MUSST_DATABASE_URL
        fromDatabase:
          name: musst-db
          property: connectionString

databases:
  - name: musst-db
    plan: free
    databaseName: musst
    user: musst
