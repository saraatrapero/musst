[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mus-engine"
version = "0.1.0"
description = "Motor de Mus determinista y validado según el Reglamento de Juego de la FEM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff==0.16.10", "mypy>=1.10,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/mus_engine"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el código usa español (ñ, tildes) a propósito

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
